[project]
name = "media2text"
version = "0.3.0"
description = "Local video/audio multimodal analysis and cross-file compilation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "yt-dlp>=2025.1.0",
  "bgutil-ytdlp-pot-provider>=1.3.0",
  "gdown>=5.2.0",
  "lancedb>=0.17.0",
  "pyarrow>=18.0.0",
  "scenedetect[opencv]>=0.6.4",
  "opencv-python-headless>=4.10.0",
  "cryptography>=43.0.0",
  "aiofiles>=24.1.0",
  "python-docx>=1.1.0",
  "reportlab>=4.2.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
queue = [
  "arq>=0.26.0",
  "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
